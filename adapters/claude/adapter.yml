# Claude Code adapter — how `kc ensure-wrappers --agent claude` renders the canon.
name: claude

# One thin command-wrapper per skill in skills/. {skill} and {description} are filled in.
wrapper:
  path: ".claude/commands/{skill}.md"
  body: |
    ---
    description: {description}
    ---
    Run the canonical skill `skills/{skill}.md` in this core. Read it in full and follow
    it exactly. It is the single source of truth; this file is only a generated pointer.

# Canon entry pointer for Claude.
pointer:
  path: "CLAUDE.md"
  body: |
    # Core — Claude entry

    Canonical, AI-agnostic instructions are in `AGENTS.md`. Read it first and follow it.
    Commands under `.claude/commands/` are generated pointers to `skills/` — do not edit by hand.

# How kc reads this assistant's session transcript to keep the session draft (ADR 0006).
# include_tool_results: tools whose results are the human's words (answers to questions).
transcript:
  format: claude-jsonl
  include_tool_results: [AskUserQuestion]

# Hooks: deep-merged into a JSON settings file. Entries whose command starts with "kc " are
# owned by kc and replaced on every run, so a changed command never leaves a stale copy.
startup:
  file: ".claude/settings.json"
  merge_json:
    hooks:
      SessionStart:
        - hooks:
            - type: command
              command: "kc hook session-start --agent claude"
      Stop:
        - hooks:
            - type: command
              command: "kc hook stop --agent claude"
      PreCompact:
        - hooks:
            - type: command
              command: "kc hook pre-compact --agent claude"
      SessionEnd:
        - hooks:
            - type: command
              command: "kc hook session-end --agent claude"
              timeout: 60
