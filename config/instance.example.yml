# Instance-level settings — committed in your core (branch main).
# Shared across all your devices. Copy to ../ecosystem/instance.yml when forking.

# Default language for sessions and for writing into modules.
# A module may override this with its own setting; a session may override via KC_LANGUAGE in .env.
language: en

# Session draft capture (ADR 0006): every N turns or M minutes, whichever comes first.
draft_every_turns: 5
draft_every_minutes: 15

# Files larger than this are never committed (ADR 0007); keep them in <media>/large/.
large_file_mb: 20
